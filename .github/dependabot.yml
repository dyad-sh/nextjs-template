version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily

    allow:
      - dependency-name: next
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"

    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
